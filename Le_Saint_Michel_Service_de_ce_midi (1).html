<title>Le Saint Michel, Service de ce midi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Concept : une carte plein écran par question, boutons larges pour tablette, palette tirée du logo (bordeaux, or, ivoire) */
:root{
  --bg:#f8f4f1; --card:#ffffff; --fg:#2a1a22; --muted:#6f5c66; --line:#e4d9d9;
  --wine:#5b1535; --wine-ink:#ffffff; --gold:#b08d3c; --gold-soft:#f3ead2;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --hint:#8a5a00; --hint-bg:#fff2d6;
  --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a0f15; --card:#26171f; --fg:#f4eaee; --muted:#bba5b0; --line:#43303b;
  --wine:#d9a3bb; --wine-ink:#2a0f1c; --gold:#d4b25e; --gold-soft:#3a2f16;
  --ok:#6fd3a0; --ok-bg:#12301f; --hint:#ffcf70; --hint-bg:#3a2a0a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a0f15; --card:#26171f; --fg:#f4eaee; --muted:#bba5b0; --line:#43303b;
  --wine:#d9a3bb; --wine-ink:#2a0f1c; --gold:#d4b25e; --gold-soft:#3a2f16;
  --ok:#6fd3a0; --ok-bg:#12301f; --hint:#ffcf70; --hint-bg:#3a2a0a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.45;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:12px;padding:4px;width:64px;height:64px;flex:none;border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
header .t{min-width:0}
header .t b{font-family:var(--font-display);font-size:1.5rem;line-height:1.1;display:block;color:var(--wine)}
header .t span{color:var(--muted);font-size:.85rem}
.dots{display:flex;gap:8px;align-items:center;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--gold)}
.dots i.now{background:var(--wine);box-shadow:0 0 0 3px var(--gold-soft)}
main{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,34px);display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--font-display);margin:0;color:var(--wine);text-wrap:balance;line-height:1.1}
h1{font-size:clamp(2rem,6vw,2.8rem)} h2{font-size:clamp(1.5rem,4.4vw,2rem)}
p{margin:0}
.lead{font-size:1.1rem}
.small{color:var(--muted);font-size:.95rem}
.scene{display:flex;gap:16px;align-items:center}
.scene svg{width:92px;height:92px;flex:none}
.q{font-size:clamp(1.15rem,3.4vw,1.35rem);font-weight:700}
.sub{color:var(--muted);font-size:.9rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{font:inherit;font-weight:600;text-align:left;width:100%;min-height:64px;padding:14px 18px;border-radius:14px;
  background:var(--card);color:var(--fg);border:2px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:center;touch-action:manipulation}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--wine);display:grid;place-items:center;font-weight:800}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.bad{border-color:var(--hint);background:var(--hint-bg);animation:nudge .35s}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .k{background:var(--ok);color:var(--card)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.opt.bad{animation:none}}
.box{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box b{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.hint{background:var(--hint-bg);color:var(--fg);border-left:6px solid var(--hint)}
.hint b{color:var(--hint)}
.expl{background:var(--ok-bg);border-left:6px solid var(--ok)}
.expl b{color:var(--ok)}
.btn{font:inherit;font-weight:800;min-height:56px;padding:12px 26px;border-radius:14px;border:0;cursor:pointer;
  background:var(--wine);color:var(--wine-ink);align-self:flex-start;touch-action:manipulation}
.btn.ghost{background:transparent;color:var(--wine);border:2px solid var(--wine)}
.frise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chip{font:inherit;width:100%;text-align:left;min-height:60px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--card);color:var(--fg);cursor:pointer;display:flex;gap:14px;align-items:center;font-weight:700;touch-action:manipulation}
.chip .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;font-weight:800}
.chip[aria-expanded="true"]{border-color:var(--gold);background:var(--gold-soft)}
.det{margin:6px 0 0 50px;color:var(--muted);font-size:.98rem}
.loop{display:flex;gap:12px;align-items:center;color:var(--wine);font-weight:700;padding:4px 0 0 4px}
.loop svg{width:28px;height:28px;flex:none}
.nopen{font-size:.85rem;color:var(--muted);text-align:center}
</style>

  <p class="nopen">Activité facultative, non notée. Pas de score, pas de limite de temps : un indice t'aide si tu hésites.</p>

<script>
var PLATE='<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="52" r="38" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="48" cy="52" r="26" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/><path d="M30 50c6-14 30-14 36 0z" fill="currentColor" opacity=".85"/><path d="M38 36c2-8 6-8 8-14M52 36c2-8 6-8 8-14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/></svg>';
var LOOP='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>';
var Q=[
 {q:"Le plat est terminé, prêt à être servi au Comptoir. D'accord, mais qu'a-t-il fallu faire avant ?",
  o:["Passer commande auprès des fournisseurs","Travailler et cuire les denrées, en suivant la fiche technique","Contrôler la température des produits livrés"],a:1,
  h:"À ce moment-là, les denrées sont déjà en cuisine. Que fait le cuisinier avec elles ?",
  e:"Oui ! Camille suit la fiche technique : elle donne les quantités et les étapes de la recette. Mais pour travailler les denrées, il faut les avoir sous la main."},
 {q:"D'accord, mais avant de les travailler, qu'a-t-il fallu faire ?",
  o:["Les sortir des stocks (chambre froide, réserve)","Rechercher de nouveaux fournisseurs","Dresser les assiettes"],a:0,
  h:"Quand la cuisine n'en a pas besoin tout de suite, où sont rangées les denrées ?",
  e:"Exact. La cuisine va chercher ce dont elle a besoin au stock, et on note ce qui sort. Tu verras en cours comment ça s'appelle."},
 {q:"D'accord, mais avant de les sortir du stock, qu'a-t-il fallu faire ?",
  o:["Écrire la fiche technique","Servir le client","Les stocker au bon endroit (au froid, à la réserve)"],a:2,
  h:"Pour sortir quelque chose du stock, il faut d'abord l'y avoir rangé. Où range-t-on le beurre ? Et le riz ?",
  e:"Oui. Chaque produit a sa place : le frais au froid, l'épicerie à la réserve sèche."},
 {q:"D'accord, mais avant de les stocker, qu'a-t-il fallu faire ?",
  o:["Fixer le prix de vente du plat","Réceptionner la livraison et la contrôler (quantité, état, température, dates)","Cuire les denrées"],a:1,
  h:"Le livreur arrive avec ses cartons. Que fait-on avant de tout ranger ?",
  e:"Oui. On vérifie que ce qui arrive correspond à ce qui était attendu. S'il y a un problème, c'est le moment de le signaler."},
 {q:"D'accord, mais avant la livraison, qu'a-t-il fallu faire ?",
  o:["Signer le bon de livraison","Cuire les denrées","Passer commande auprès du fournisseur"],a:2,
  h:"Le livreur ne vient pas sans raison. Qu'est-ce qui l'a fait venir ? (Signer le bon, c'est quand il est déjà là.)",
  e:"Oui. Le restaurant s'engage auprès du fournisseur : quoi, combien, pour quelle date."},
 {q:"D'accord, mais avant de passer commande, qu'a-t-il fallu faire ?",
  o:["Rechercher et choisir un ou plusieurs fournisseurs (prix, qualité, délais)","Contrôler la livraison","Sortir les denrées du stock"],a:0,
  h:"À qui Camille passe-t-elle commande ? Comment l'a-t-elle choisi ?",
  e:"Oui. Camille compare avant de s'engager : le prix, la qualité, les délais de livraison."},
 {q:"D'accord, mais avant de chercher un fournisseur, qu'a-t-il fallu faire ?",
  o:["Ranger la chambre froide","Dresser les assiettes","Prévoir les besoins : quoi acheter, et en quelle quantité"],a:2,
  h:"Camille ne peut pas chercher un fournisseur sans savoir quoi acheter ni combien. Quel document lui donne les quantités pour chaque portion ?",
  e:"Oui. Avec la fiche technique et le nombre de couverts prévus, Camille calcule ses besoins. On retrouve la fiche technique du début !"},
 {q:"Pour prévoir ses besoins, Camille doit aussi savoir ce qu'il reste déjà. D'accord, mais qu'a-t-il fallu faire avant ?",
  o:["Signer le bon de livraison","Suivre et gérer les stocks (ce qui entre, ce qui sort, ce qui reste)","Décider du prix de vente"],a:1,
  h:"Quand on sort des denrées du stock, on le note. À quoi cela sert-il pour la prochaine commande ?",
  e:"Oui. Le circuit est un cercle : le stock qui reste aide à prévoir les besoins suivants."}
];
var STEPS=[
 {t:"Prévoir les besoins",d:"Avec la fiche technique et le nombre de couverts, Camille calcule quoi acheter et en quelle quantité."},
 {t:"Rechercher les fournisseurs",d:"Elle compare les prix, la qualité et les délais avant de choisir."},
 {t:"Passer commandes",d:"Le restaurant s'engage auprès du fournisseur : quoi, combien, pour quand."},
 {t:"Réceptionner et vérifier la conformité de la livraison",d:"On contrôle la quantité, l'état, la température et les dates avant de ranger."},
 {t:"Stocker et délivrer les produits",d:"Chaque produit est rangé au bon endroit, puis sorti du stock quand la cuisine en a besoin."},
 {t:"Gérer les stocks",d:"On suit ce qui entre, ce qui sort et ce qui reste, pour prévoir les besoins suivants."}
];
var app=document.getElementById('app'),dotsEl=document.getElementById('dots'),LET=['A','B','C'];
function dots(i){var h='';for(var k=0;k<8;k++)h+='<i class="'+(i===null||k<i?'on':(k===i?'now':''))+'"></i>';dotsEl.innerHTML=h}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function intro(){dots(0);
 app.innerHTML='<div class="scene"><div style="color:var(--gold)">'+PLATE+'</div><h1>Service de ce midi</h1></div>'+
 '<p class="lead">Camille Roussel, cheffe du Saint Michel, envoie un plat au Comptoir.</p>'+
 '<p class="lead">Remonte le temps avec elle, une question à la fois. À chaque fois, choisis la bonne réponse parmi trois.</p>'+
 '<button class="btn" id="go">Commencer</button>';
 document.getElementById('go').onclick=function(){ask(0)}}
function ask(i){var Qi=Q[i];dots(i);
 var h='<div class="sub">Question '+(i+1)+' sur 8</div>';
 if(i===0)h+='<div class="scene"><div style="color:var(--gold)">'+PLATE+'</div><div class="q">'+esc(Qi.q)+'</div></div>';
 else h+='<div class="q">'+esc(Qi.q)+'</div>';
 h+='<div class="opts">';
 Qi.o.forEach(function(t,k){h+='<button class="opt" data-k="'+k+'"><span class="k">'+LET[k]+'</span><span>'+esc(t)+'</span></button>'});
 h+='</div><div id="fb"></div>';
 app.innerHTML=h;
 var btns=app.querySelectorAll('.opt'),fb=document.getElementById('fb');
 btns.forEach(function(b){b.onclick=function(){
  var k=+b.getAttribute('data-k');
  if(k!==Qi.a){b.classList.add('bad');b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');
    fb.innerHTML='<div class="box hint"><b>Un indice</b><p>'+esc(Qi.h)+'</p><p class="small">Essaie une autre réponse, ce n\'est pas grave.</p></div>';return}
  btns.forEach(function(x,j){x.disabled=true;x.classList.remove('bad');if(j===Qi.a)x.classList.add('good');else x.classList.add('dim')});
  fb.innerHTML='<div class="box expl"><b>Bonne réponse</b><p>'+esc(Qi.e)+'</p></div><div style="height:14px"></div><button class="btn" id="nx">'+(i<7?'Continuer':'Voir le circuit complet')+'</button>';
  document.getElementById('nx').onclick=function(){i<7?ask(i+1):fin()};
  document.getElementById('nx').focus({preventScroll:false})}})
 window.scrollTo(0,0)}
function fin(){dots(null);
 var h='<h2>Le circuit reconstitué</h2><p class="lead">Tu as remonté le circuit à l\'envers. Voici le même circuit dans le sens habituel. Touche une étape pour la rappeler.</p><ol class="frise">';
 STEPS.forEach(function(s,k){h+='<li><button class="chip" aria-expanded="false" data-k="'+k+'"><span class="n">'+(k+1)+'</span><span>'+esc(s.t)+'</span></button><p class="det" hidden>'+esc(s.d)+'</p></li>'});
 h+='</ol><div class="loop">'+LOOP+'<span>Puis on repart à l\'étape 1 : c\'est un cercle.</span></div>'+
 '<p class="small">En cours, on reparcourt ce circuit avec les vrais documents.</p><button class="btn ghost" id="again">Recommencer</button>';
 app.innerHTML=h;
 app.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){var d=c.parentNode.querySelector('.det'),o=d.hidden;d.hidden=!o;c.setAttribute('aria-expanded',o?'true':'false')}});
 document.getElementById('again').onclick=intro;window.scrollTo(0,0)}
intro();
</script>
